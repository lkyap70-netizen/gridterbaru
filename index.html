<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>POLSEK JATIROGO - Generator Dokumentasi</title>

  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 1rem 0.85rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app-container { width: 100%; max-width: 520px; margin: 0 auto; }

    .header { text-align: center; padding: 0 0 1.25rem; }
    .header-badge {
      display: inline-block;
      background-color: rgba(225, 29, 72, 0.15);
      color: #fb7185;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }
    .header h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; line-height: 1.2; }
    .header h2 { font-size: 1rem; font-weight: 700; color: #cbd5e1; margin-top: 0.15rem; letter-spacing: 1px; }

    .frame-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 0.65rem 0.85rem; border-radius: 10px;
      margin-bottom: 1.2rem; border: 1px solid #334155; font-size: 0.8rem;
    }
    .frame-bar span { color: #94a3b8; font-weight: 500; }

    .btn-small {
      background: #334155; color: #f8fafc; border: none;
      padding: 0.35rem 0.65rem; border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .card { background: #1e293b; border-radius: 14px; padding: 1.2rem; border: 1px solid #334155; margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 1.15rem; }
    .form-label {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; font-weight: 600; color: #e2e8f0; margin-bottom: 0.5rem;
    }
    .form-label span.hint { font-size: 0.75rem; color: #94a3b8; font-weight: 400; }

    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .photo-btn {
      position: relative; background: #0f172a; border: 1.5px dashed #475569;
      border-radius: 10px; padding: 0.85rem 0.5rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
    }
    .photo-btn.active { border-style: solid; border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
    .photo-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .photo-btn .title { font-size: 0.78rem; font-weight: 700; color: #f1f5f9; margin-bottom: 0.15rem; }
    .photo-btn .status {
      font-size: 0.7rem; color: #94a3b8; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 90%;
    }
    .photo-btn.active .title { color: #10b981; }
    .photo-btn.active .status { color: #34d399; font-weight: 600; }

    select, textarea, input[type="text"] {
      width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 10px;
      padding: 0.75rem 0.85rem; font-size: 0.85rem; color: #fff; outline: none;
    }
    select {
      margin-bottom: 0.65rem; cursor: pointer; appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 0.85rem center; background-size: 1em;
    }
    select option { background: #0f172a; color: #f8fafc; }
    select:focus, textarea:focus, input[type="text"]:focus { border-color: #e11d48; }
    textarea::placeholder, input[type="text"]::placeholder { color: #64748b; font-size: 0.82rem; }

    .date-row { display: flex; gap: 0.5rem; }
    .date-row input { flex: 1; }
    .btn-today {
      background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 10px;
      padding: 0 0.85rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }

    .btn-generate {
      width: 100%; background: #e11d48; color: #fff; border: none; border-radius: 12px;
      padding: 0.95rem; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
    }
    .btn-generate:active { background: #be123c; transform: scale(0.98); }

    .preview-card {
      background: #1e293b; border-radius: 14px; padding: 1.2rem; border: 1px solid #334155;
      text-align: center; display: none; margin-bottom: 1.5rem;
    }
    .preview-title {
      font-size: 0.85rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    #resultImage { width: 100%; height: auto; border-radius: 8px; border: 2px solid #475569; margin-bottom: 1rem; display: block; }
    #outputCanvas { display: none; }
    .btn-download-direct {
      width: 100%; background: #10b981; color: #fff; padding: 0.95rem; font-size: 0.95rem;
      font-weight: 700; border-radius: 10px; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; border: none;
    }
    .btn-download-direct:active { background: #059669; }

    .dl-title { font-size: .78rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin: 1.1rem 0 .6rem; }
    .btn-download-all {
      width: 100%; background: #2563eb; color: #fff; padding: .95rem; font-size: .95rem; font-weight: 700;
      border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-download-all:active { background: #1d4ed8; }
    .dl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .6rem; }
    .dl-grid a {
      background: #334155; color: #f8fafc; text-decoration: none; border-radius: 10px;
      padding: .7rem .5rem; font-size: .8rem; font-weight: 600; text-align: center;
    }
    .dl-grid a:active { background: #475569; }
    .footer-copyright { text-align: center; padding: 1rem 0 0.5rem; font-size: 0.75rem; color: #64748b; letter-spacing: 0.3px; }
    .footer-copyright .author { color: #94a3b8; font-weight: 700; }

    /* --- KETERANGAN GPS --- */
    .gps-check { display: flex; align-items: center; gap: .5rem; font-size: .82rem; color: #e2e8f0; margin-bottom: .6rem; cursor: pointer; }
    .gps-check input { width: 1.05rem; height: 1.05rem; accent-color: #e11d48; }
    .gps-sub { font-size: .72rem; color: #94a3b8; margin: .2rem 0 .4rem; }
    .gps-row { display: grid; grid-template-columns: 2.4rem 1.25fr 1fr 1fr; gap: .4rem; align-items: center; margin-bottom: .4rem; }
    .gps-row b { font-size: .74rem; color: #cbd5e1; }
    .gps-row input[type="text"] { padding: .55rem .5rem; font-size: .76rem; }
    .gps-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .gps-2 input { margin-bottom: .5rem; }

    .map-hint {
      font-size: 0.75rem; color: #64748b; font-style: italic;
      background: rgba(16, 185, 129, 0.1); padding: 0.6rem; border-radius: 6px;
      margin-bottom: 0.8rem; border-left: 3px solid #10b981;
    }

    /* ============ PETA SATELIT ============ */
    .gmap-wrap {
      position: relative; border-radius: 12px; overflow: hidden;
      border: 1px solid #475569; margin: 0 0 1rem 0; background: #1b2a1f;
    }
    #gpsMap { width: 100%; height: 440px; background: #1b2a1f; z-index: 0; }
    .leaflet-container { font-family: 'Inter', -apple-system, sans-serif; background: #1b2a1f; }

    /* Kotak pencarian melayang */
    .gm-search {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
    }
    .gm-search-bar {
      display: flex; align-items: center; background: #fff; border-radius: 28px;
      box-shadow: 0 2px 6px rgba(60,64,67,.3), 0 1px 2px rgba(60,64,67,.15);
      padding: 0 6px 0 14px; height: 46px;
    }
    .gm-search-bar svg { flex: none; }
    .gm-search-bar input#mapSearchBox {
      flex: 1; border: none; background: transparent; color: #202124;
      font-size: .92rem; padding: 0 10px; height: 100%; border-radius: 0;
    }
    .gm-search-bar input#mapSearchBox::placeholder { color: #70757a; font-size: .9rem; }
    .gm-search-bar input#mapSearchBox:focus { border: none; }
    .gm-clear {
      border: none; background: transparent; width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: none; align-items: center; justify-content: center; color: #5f6368;
    }
    .gm-clear:hover { background: #f1f3f4; }
    .search-results {
      background: #fff; border-radius: 12px; margin-top: 6px; max-height: 240px; overflow-y: auto;
      box-shadow: 0 2px 6px rgba(60,64,67,.3), 0 1px 2px rgba(60,64,67,.15); display: none;
    }
    .search-results.active { display: block; }
    .search-item {
      display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; cursor: pointer;
      color: #202124; font-size: .84rem; border-bottom: 1px solid #f1f3f4;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #f8f9fa; }
    .search-item .pin { flex: none; margin-top: 2px; }
    .search-item strong { display: block; font-weight: 600; }
    .search-item small { color: #70757a; font-size: .74rem; line-height: 1.3; display: block; }
    .search-item .badge {
      display: inline-block; background: #e6f4ea; color: #137333; font-size: .62rem; font-weight: 700;
      padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
    }
    .search-loading { padding: 12px 14px; color: #70757a; font-size: .8rem; }

    /* Tombol di kanan bawah (zoom + lokasi saya) */
    .leaflet-bottom.leaflet-right { margin-bottom: 18px; }
    .leaflet-control-zoom { border: none !important; box-shadow: 0 2px 6px rgba(60,64,67,.3) !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-control-zoom a {
      width: 40px !important; height: 40px !important; line-height: 40px !important;
      font-size: 22px !important; color: #5f6368 !important; background: #fff !important; border: none !important;
    }
    .leaflet-control-zoom a:first-child { border-bottom: 1px solid #e8eaed !important; }
    .leaflet-control-zoom a:hover { background: #f1f3f4 !important; color: #202124 !important; }
    .gm-btn {
      width: 40px; height: 40px; background: #fff; border: none; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(60,64,67,.3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .gm-btn:hover { background: #f1f3f4; }
    .gm-btn.busy svg { animation: gmspin 1s linear infinite; }
    @keyframes gmspin { to { transform: rotate(360deg); } }

    /* Kartu info koordinat bawah */
    .gm-card {
      position: absolute; left: 10px; right: 62px; bottom: 28px; z-index: 1000;
      background: #fff; border-radius: 10px; padding: 8px 12px; color: #202124;
      box-shadow: 0 2px 6px rgba(60,64,67,.3); font-size: .74rem; line-height: 1.35;
      display: none; min-height: 40px;
    }
    .gm-card .t { font-weight: 700; font-size: .8rem; color: #202124; }
    .gm-card .c { color: #5f6368; }

    /* Pin merah ala Google */
    .gm-pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
    .gm-pin-drop { animation: gmdrop .35s ease-out; }
    @keyframes gmdrop { from { transform: translateY(-24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .leaflet-control-attribution { font-size: 10px !important; background: rgba(255,255,255,.8) !important; color: #5f6368 !important; }
    .leaflet-control-attribution a { color: #1a73e8 !important; }
  </style>
</head>
<body>

  <div class="app-container">

    <header class="header">
      <div class="header-badge">Humas Presisi</div>
      <h1>POLSEK JATIROGO</h1>
      <h2>POLRESTA TUBAN</h2>
    </header>

    <div class="card">

      <!-- FOTO KEGIATAN -->
      <div class="form-group">
        <div class="form-label">
          <span>Foto Kegiatan</span>
          <span class="hint">Pilih 1 - 4 foto</span>
        </div>
        <div class="photo-grid">
          <div class="photo-btn" id="card1">
            <span class="title">Foto 1 (Wajib)</span>
            <span class="status" id="label1">+ Pilih Foto</span>
            <input type="file" id="foto1" accept="image/*" />
          </div>
          <div class="photo-btn" id="card2">
            <span class="title">Foto 2</span>
            <span class="status" id="label2">+ Pilih Foto</span>
            <input type="file" id="foto2" accept="image/*" />
          </div>
          <div class="photo-btn" id="card3">
            <span class="title">Foto 3</span>
            <span class="status" id="label3">+ Pilih Foto</span>
            <input type="file" id="foto3" accept="image/*" />
          </div>
          <div class="photo-btn" id="card4">
            <span class="title">Foto 4</span>
            <span class="status" id="label4">+ Pilih Foto</span>
            <input type="file" id="foto4" accept="image/*" />
          </div>
        </div>
      </div>

      <!-- KETERANGAN KEGIATAN -->
      <div class="form-group">
        <div class="form-label">
          <span>Keterangan Kegiatan</span>
          <span class="hint">Pilih template / edit</span>
        </div>

        <select id="templateSelector">
          <option value="" selected disabled>-- Pilih Template Kegiatan Polsek Jatirogo --</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN GIAT OPS OFFENSIF DI DEPAN MAPOLSEK JATIROGO DI PIMPIN OLEH KAPOLSEK JATIROGO IPTU.M ARIF NUGROHO,S.H.">1. Giat Ops Offensif di Depan Mapolsek</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PENGATURAN ARUS LALU LINTAS ANTISIPASI KEMACETAN DAN LAKA LANTAS">2. Pengaturan Arus Lalu Lintas (Kemacetan & Laka)</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI BLUE LIGHT MENJELANG SUBUH ANTISIPASI 3C DAN GANGGUAN KAMTIBMAS LAINNYA">3. Patroli Blue Light Menjelang Subuh (3C)</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI KOTA PRESISI DI SWALAYAN SPBU PERTOKOAN EMAS DAN ATM PERBANKAN">4. Patroli Kota Presisi (Swalayan, SPBU, Perbankan)</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI DIALOGIS DENGAN PENJAGA SEKOLAHAN DI WILAYAH KECAMATAN JATIROGO">5. Patroli Dialogis dengan Penjaga Sekolahan</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI DALOGIS DENGAN PETUGAS SATKAMLING DI WILAYAH KECAMATAN JATIROGO">6. Patroli Dialogis dengan Petugas Satkamling</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI KARHUTLA DI LAHAN HUTAN MILIK WARGA DI WILAYAH KEC. JATIROGO">7. Patroli Karhutla Lahan Hutan Milik Warga</option>
          <option value="POLSEK JATIROGO MELAKSANAKAN PATROLI KARHUTLA DI LAHAN HUTAN MILIK PERHUTANI DI WILAYAH KEC. JATIROGO">8. Patroli Karhutla Lahan Hutan Milik Perhutani</option>
